<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1000" cy="100" r="200" fill="rgba(59,130,246,0.1)"/>
  <circle cx="200" cy="500" r="150" fill="rgba(6,182,212,0.08)"/>

  <!-- Logo circle -->
  <circle cx="180" cy="180" r="60" fill="url(#accent)"/>
  <text x="180" y="205" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle">K</text>

  <!-- Main title -->
  <text x="180" y="330" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">
    Kursus Mobil
  </text>
  <text x="180" y="400" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#accent)">
    Bantul
  </text>

  <!-- Subtitle -->
  <text x="180" y="460" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.7)">
    Belajar Mengemudi • Instruktur Profesional • Garansi Sampai Mahir
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#accent)" opacity="0.9"/>
  <text x="600" y="616" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">
    kursusmobilbantul.com • 0812-3456-7890
  </text>
</svg>
